; ============================================================
; encode-segments.ps1 配置文件 setting.ini
; ------------------------------------------------------------
; 作用：把常用参数集中在这里，运行时不必每次敲命令行。
; 优先级：命令行参数  >  本文件  >  脚本内置默认值。
; 用法：
;   方式A（推荐）：把本文件放在脚本同一目录，然后直接运行
;       powershell -ExecutionPolicy Bypass -File encode-segments.ps1
;   方式B：指定别的配置文件
;       powershell -ExecutionPolicy Bypass -File encode-segments.ps1 -Ini "D:\my.ini"
; 修改后直接重跑脚本即可生效，无需改动脚本本体。
;
; 填写规则：
;   - 每项格式为  键名 = 值   （等号前后空格会被自动忽略）
;   - 以 ; 或 # 开头的行是注释，不会生效
;   - 真/假 用 true / false 表示（也接受 1/0、yes/no、on/off）
;   - 路径含中文时，请把本文件"另存为 UTF-8 编码"（记事本：保存类型选 UTF-8），
;     否则脚本读到的中文路径会乱码。
;   - 下面的"示例"仅说明格式，正式使用时请换成你自己的路径/数值。
; ============================================================
;
; ★★★ 本目录 = Video_Compressor_x265_best（当前最优配方，与另两套互不干扰）★★★
;
;   设计目标（按 Mr. Xu 的口径）：压缩率越大越好 + 速度越快越好，
;   画质只要落在"人眼看不太出"的区间即可，不为看不见的清晰度浪费码率。
;
;   与另外两套的区别（一眼看懂）：
;     ┌──────────────────────┬────────────┬────────────┬───────────────────┐
;     │ 目录                 │ 分辨率     │ CRF        │ 定位              │
;     ├──────────────────────┼────────────┼────────────┼───────────────────┤
;     │ _x265__crf28（旧）   │ 原始分辨率 │ 28         │ 清晰、体积大、慢 │
;     │ _x265_deep（旧）     │ 768 宽     │ 28         │ 小、快，但偏糊   │
;     │ _x265_best（本目录） │ 960 宽     │ 32（默认） │ 小 + 快，且不糊  │
;     └──────────────────────┴────────────┴────────────┴───────────────────┘
;   说明：deep 版把画面压到 768x432 —— 那正是"压出来模糊"的元凶（不是 x265 的锅）。
;         best 版抬到 960x540（540p）并把 CRF 松到 32，体积仍远小于原分辨率，
;         但肉眼不再发糊；速度依然比原分辨率快好几倍。
;
;   本目录内置【两个版本】，切换方法见下方 [Encode] 的 FFmpegCmd 两档预设：
;     版本A · 均衡档（当前默认，推荐）：960 宽(540p) + CRF 32 + fast  → 最小最快、看不太出
;     版本B · 清晰档（备选）          ：1280 宽(720p) + CRF 30 + fast → 更清楚，体积约大 1 倍
;   默认走版本A（即下面 Crf/Preset/Downscale 分项设置那一套，FFmpegCmd 留空）。

[Source]
; —— 视频来源：填【单个文件】或【目录】路径（目录 = 批量处理其下所有视频）——
; 三种填法任选其一：
;   1) 留空（推荐，直接把视频丢进脚本同目录即可）：
;        Video =
;      → 自动批量处理"脚本所在目录"下的所有视频
;   2) 单文件：Video = D:\BaiduNetdiskDownload\ofje-550-12.mp4
;   3) 目录  ：Video = D:\BaiduNetdiskDownload\test
Video =

; —— 目录模式是否递归子目录（仅 Video 为目录时有效）——
; 取值： true（连子文件夹一起扫） / false（只扫当前目录）
; 示例: Recurse = true
Recurse = false

; —— 仅处理大于此大小的文件（单位 MB，0 = 全部处理）——
; 适合"只压大视频、跳过小片段"的场景
; 示例: MinSizeMB = 500
MinSizeMB = 0

; —— 视频文件扩展名过滤（逗号分隔，大小写不限）——
; 留空 = 默认扫描全部常见格式 (.mp4,.mkv,.mov,.avi,.flv,.webm,.m4v,.ts,.wmv)
; 示例: VideoExt = .mp4,.mkv,.avi
; 想识别自定义扩展名（比如你把 mp4 改名成 .mp4del 来标记待压文件），直接加进来即可：
; 示例: VideoExt = .mp4,.mp4del
VideoExt =


[FFmpeg]
; —— ffmpeg.exe 路径（ffprobe.exe 须与它在同一目录）——
; 三种填法任选其一：
;   1) 留空（推荐，把 ffmpeg.exe/ffprobe.exe 放脚本同目录即可）：
;        Ffmpeg =
;      → 自动使用"脚本所在目录"下的 ffmpeg.exe
;   2) 已加入系统 PATH，直接写裸名（不带路径）：
;        Ffmpeg = ffmpeg
;   3) 指定完整路径：
;        Ffmpeg = C:\ffmpeg\bin\ffmpeg.exe
; 无论哪种，ffprobe.exe 都会自动取与 ffmpeg 同一目录下的同名程序
Ffmpeg =


[Output]
; —— 输出根目录：留空 = 在各视频旁建"<视频名>"子目录；
;    填了 = 统一输出到 该目录\<视频名>\（批量时互不冲突）——
; 示例: OutDir = D:\Encoded
OutDir =

; —— 每段时长（秒）。越小断点损失越小、段数越多 ——
; 推荐 300（细粒度，断电最多丢5分钟）~ 600（10分钟）
; 示例: SegLen = 300
SegLen = 30

; —— 输出文件名后缀（合并后 final.mp4 改名为：<原名+后缀>.mp4）——
; 留空 = 保留默认名称 final.mp4
; 本目录特意设成 _x265_best，成品文件名即带 best 标记，不会和另外两套的产物混淆
; 示例: NameSuffix = _hevc   → 十六字令.mp4 变成 十六字令_hevc.mp4
NameSuffix = _x265_best


[Encode]
; —— 视频编码器：libx265（更高压缩率）或 libx264（兼容性最好）——
; 示例: Codec = libx264
Codec = libx265

; —— CRF 质量值（恒定质量，越小越好、越大越省体积）——
; H.265 的 CRF 刻度比 H.264 高约 5~6：x265 CRF 28 ≈ x264 CRF 24（常用观感）
; ★ best 版默认 32：落在"小体积 + 人眼看不太出"的甜点；
;   想更清楚用 30（体积约大 20~30%），想更狠用 34（渐变处开始可见色带，谨慎）
; 推荐区间 30~34
; 示例: Crf = 32
Crf = 30

; —— 速度档（速度 ↔ 体积权衡）——
; 可选：ultrafast / veryfast / fast / medium / slow / slower
; best 版固定 fast：比 medium 快、比 veryfast 体积小，是"又快又小"的平衡点。
; （注意：不要再升到 slow —— 慢一倍只小约 5~10%，不划算；
;   也不要降到 veryfast —— 更快，但同画质文件反而更大，与"压缩率优先"冲突）
; 示例: Preset = fast
Preset = fast

; —— 像素格式 ——
; yuv420p10le：10bit，体积更小画质更好，需较新设备播放（推荐）
; yuv420p    ：8bit，兼容性最好，老设备无忧
; best 版保留 10bit：高 CRF 下 10bit 更抗色带，且压缩率略优。
; 若播放端老到不支持 HEVC 10bit，改成 yuv420p
; 示例: PixelFormat = yuv420p
PixelFormat = yuv420p10le

; —— 音频编码器 与 码率 ——
; 语音/课件 96k 够用；音乐建议 128k
; 示例: AudioCodec = aac
;       AudioBitrate = 128k
AudioCodec = aac
AudioBitrate = 96k

; —— H.265 打 hvc1 标签（让苹果设备/QuickTime 能播放）：true / false ——
; 仅当 Codec=libx265 时有效；用 libx264 时自动忽略
TagHvc1 = true

; —— x265 动漫向调参（仅当 Codec=libx265 生效；用 libx264 时自动忽略）——
; 含义：bframes=8 多 B 帧省体积；qcomp=0.5 量化更平；psy-rd/psy-rdoq 调低保留锐利线条；
;       aq-mode=2/aq-strength=0.8 自适应量化；no-sao=1 关 SAO 保细节；
;       threaded-me=1 多线程运动估计（x265 4.2+，多核提速；若你的 x265 旧于 4.2 请删掉此项）
; 整体留空 = 不附加额外参数，用 x265 出厂默认
X265Params = bframes=8:qcomp=0.5:psy-rd=1.0:psy-rdoq=0.5:aq-mode=2:aq-strength=0.8:no-sao=1:threaded-me=1

; —— 【最高优先级】自定义 ffmpeg 压缩命令（留空则走上面 Crf/Preset/Codec 等分项设置）——
; 只要这里非空，程序就【自动切片】，并用"本命令"逐段【重编码】，最后【合并】成一个成品；
; 上面所有编码设置（Crf/Preset/Codec/X265Params/Downscale/PixelFormat/faststart）全部被忽略，
; 你写的命令对编码拥有完全控制权。支持两种写法，【粘进去就能用，无需改命令】：
;
;   ★ 写法 B（最省事，推荐）：直接从别处复制"完整命令"粘进来，连 {input}/{output} 都不用写！
;     例： FFmpegCmd = ffmpeg -i D:\临时\原片.mp4 -c:v libx265 -crf 28 -c:a aac D:\临时\成品.mp4
;     程序会自动：① 丢掉开头的 ffmpeg  ② 把第一个 -i 后面的文件换成真实源
;                ③ 把最后一个输出文件换成"本段分段输出"  ④ 清掉命令里自带的 -ss/-t/-to
;                ⑤ 在 -i 后注入 -ss 起始秒 -t 时长秒（按 [Output] SegLen 自动切片）
;     所以原命令里路径、文件名都随便写，程序一律忽略并替换。
;
;   ★ 写法 A（显式占位符，更稳）：用 {input}/{output} 标定输入输出
;     {input}  = 源视频（程序自动加引号）   {output} = 本段分段输出（程序自动加引号）
;
; 两种写法下，程序都会自动在前面加 -hide_banner -y，并按 SegLen 注入 -ss/-t 切片，
; 你【不要再自己写 -ss / -t / -y】。合并步骤仍由程序自动完成（分段直接 -c copy 拼接）。
; —— 本目录【两个版本】的预设：复制下面任意一行，粘到 FFmpegCmd = 后面即可选中该版本 ——
;   （粘哪一档，程序就用哪一档去自动切片 + 逐段重编码 + 合并）
;   版本A · 均衡档（= 当前默认效果，推荐）：960 宽(540p) + CRF32 + fast + x265 调参 + faststart：
;     FFmpegCmd = ffmpeg -i 源.mp4 -map 0:v:0? -map 0:a:0? -c:v libx265 -preset fast -crf 32 -tag:v hvc1 -x265-params bframes=8:qcomp=0.5:psy-rd=1.0:psy-rdoq=0.5:aq-mode=2:aq-strength=0.8:no-sao=1:threaded-me=1 -c:a aac -b:a 96k -vf "scale=960:-2:flags=lanczos,format=yuv420p10le" -movflags +faststart 输出.mp4
;   版本B · 清晰档（备选，更清楚）：1280 宽(720p) + CRF30 + fast + x265 调参 + faststart：
;     FFmpegCmd = ffmpeg -i 源.mp4 -map 0:v:0? -map 0:a:0? -c:v libx265 -preset fast -crf 30 -tag:v hvc1 -x265-params bframes=8:qcomp=0.5:psy-rd=1.0:psy-rdoq=0.5:aq-mode=2:aq-strength=0.8:no-sao=1:threaded-me=1 -c:a aac -b:a 96k -vf "scale=1280:-2:flags=lanczos,format=yuv420p10le" -movflags +faststart 输出.mp4
;   预设里的 源.mp4 / 输出.mp4 只是占位文字，程序会自动替换成真实源与分段输出，你无需改动。
;
; 示例（从网上抄来的任意完整命令，原样粘入也能用，连 {input}/{output} 都不用写）：
;   FFmpegCmd = ffmpeg -i in.mp4 -c:v libx265 -crf 32 -preset fast -c:a aac -b:a 96k out.mp4
; 想用 H.264：把 libx265 换成 libx264、删掉 -tag:v hvc1 与 -pix_fmt yuv420p10le 即可。
FFmpegCmd =

; —— 是否降分辨率（默认 true 开启）——
; true  = 压制时把画面缩到下方目标宽高（速度提升最明显，比调 preset 更显著）
; false = 保留原始分辨率（高画质归档，但 5600U 上很慢）
Downscale = true

; —— 降分辨率目标宽/高（仅 Downscale=true 时生效）——
; DownscaleW 为目标宽度；DownscaleH 为目标高度
;   -2  = 按宽度等比缩放、高度自动取偶数（不变形，推荐）
; best 版默认 960 / -2 → 1080p 源变成 960x540（540p），比 deep 版的 768x432 清楚得多，
;                        体积与速度依然远优于原始分辨率
; ✅ 已内置"窄源不放大"自动保护：若源本身宽度 ≤ 960（例如 720p、竖屏 720x1280、
;    或已经是小分辨率的课件），引擎会自动跳过缩放、保留原始分辨率，
;    避免被放大导致文件变大又发虚；控制台会打印一行 no upscaling 提示。
;    （想强制缩到某个宽度时，把 DownscaleW 设成小于源宽的值即可。）
DownscaleW = 1080
DownscaleH = -2

; —— 烧录同目录同名字幕（焊进画面，字幕随分段对齐）：true / false ——
; 开启后脚本会自动找"与视频同名的 .ass/.srt"烧进画面
; 示例: BurnSub = true
; 注意：开启后会把同名字幕焊进画面（所有设备可见），此时下面的 [Subtitle] 封装会自动跳过，避免重复。
BurnSub = true

[Subtitle]
; —— 字幕封装模式（把源视频内嵌字幕轨封装进输出 mp4，不烧进画面）——
;   copy     = 直接复制字幕轨（无损最快；图形字幕 PGS/SUP 不能进 MP4，仅 MKV/TS 支持）
;   mov_text = 转成 mov_text 文本字幕（兼容性最好，能进 MP4；需源字幕为文本字幕轨）
;   off      = 不封装字幕轨
; 默认 copy。注意：若上方 [Encode] BurnSub=true，字幕已焊进画面，此处封装会被自动跳过。
Mode = copy

[Run]
; —— 只压前 N 段做测试（0 = 全部）。配合 SegLen 可先压一小段验证 ——
; 示例: FirstN = 1
FirstN = 0

; —— 仅探测（算分段数/预估耗时，不压制）：true / false ——
; 示例: ProbeOnly = true
ProbeOnly = false

; —— 只合并已压好的分段（不重新编码）：true / false ——
; 已压完想重新合并、或换电脑合并时用
; 示例: ConcatOnly = true
ConcatOnly = false

; —— 合并完成后自动清理中间分段（part_*.mp4 / concat.txt）：true / false ——
; 默认 true：final.mp4 经校验覆盖完整源时长后即删除分段，省空间；
;            同时写 ENCODE_DONE.flag 标记完成，下次重跑直接跳过该视频
; 若想保留分段以便手动重合并，设为 false
; 示例: CleanUp = false
CleanUp = true

; —— 是否显示 ffmpeg 原始输出（true / false）——
; 默认 false：ffmpeg 的冗长诊断信息（Input/Stream/x265 info 等）写入
;   每段日志文件（ffmpeg_xxx.log），控制台只保留一行「文件名 + 时间段 + 进度%」，
;   固定在窗口底部不被刷屏顶上去；
;   若需排查压制问题，设为 true 即可看到 ffmpeg 完整原始输出
; 示例: ShowFfmpeg = true
ShowFfmpeg = false


[Monitor]
; —— 常驻监控（video_monitor.ps1 / compress_video.bat 专用）——
; 此段可整段留空或删除，脚本会用下方内置默认值。
; 监控目录：留空 = 沿用 [Source] Video（若是目录）；[Source] 也是目录留空 = 脚本所在目录
; 示例: Dir = D:\你的视频文件夹
Dir =

; —— 空闲时每多少秒重新扫描一次（秒）——
; 有新文件出现时会立即扫描，不必等这个间隔
; 示例: PollSeconds = 15
PollSeconds = 15

; —— 发现新文件后，等多久确认拷贝稳定再开始压（秒）——
; 防止压到一半还在增长的文件（拷贝中）
; 示例: SettleSeconds = 4
SettleSeconds = 4

; —— 连续多少分钟没"发现新视频"就自动退出程序（分钟）——
; 默认 5：挂了 5 分钟没新活儿就自己收工，不用手动关窗口
; 设为 0 = 永不自动退出，一直挂着等（手动 Ctrl+C 才停）
; 示例: IdleExitMinutes = 10
IdleExitMinutes = 1



; ============================================================
; 【完整命令速查 · best 版两档】—— 当前配置下工具实际执行的单段 ffmpeg 命令
;   版本A 均衡档（默认）= 960 宽(540p) + CRF32：最小最快、人眼看不太出
;   版本B 清晰档（备选）= 1280 宽(720p) + CRF30：更清楚，体积约大一倍
;   下面就是上方 FFmpegCmd 两档预设对应的"底层展开命令"，供手动单跑或对照参考。
; 把下面的占位符替换成实际值，即可在命令行手动单跑这一段；也可抄进上方 FFmpegCmd
; （注意：若抄进 FFmpegCmd，工具会自动在 -i 后注入 -ss/-t，命令里不要再写 -ss/-t/-y）。
;   <源视频>   源文件路径（可带空格/中文，请自行加英文双引号）
;   <起始秒>   本段起始时间(秒)。【自动切片时由程序按 SegLen 算：start=(段序号-1)*SegLen，无需手填】
;   <时长秒>   本段时长(秒)。【自动切片时为 t=min(SegLen, 剩余时长)，程序自动算，无需手填】
;   <分段输出> 本段输出文件名，如 part_001.mp4
; 说明：自动切片时 -ss/-t 由程序依据 [Output] SegLen（本文件=30 秒）逐段计算，你只改 SegLen 即可控制分段粒度；
;       手动单跑某一段或抄进 FFmpegCmd 时，这两值由你/工具给出，不用自己算。
; best 版特征：960 宽降分辨率 + CRF32 + x265 动漫向调参 + -movflags +faststart（利于网页/流媒体秒开）。
; 合并步骤（所有分段压完后由工具自动做，这里列出供手动参考）：
;   ffmpeg -hide_banner -y -f concat -safe 0 -i concat.txt -c copy final.mp4

; —— 版本A · 标准版（BurnSub=false 或不存在同名字幕时；Downscale=true 会缩到 960 宽）——
; ffmpeg -hide_banner -y -i "<源视频>" -ss <起始秒> -t <时长秒> -map 0:v:0? -map 0:a:0? -c:v:0 libx265 -preset:v:0 fast -x265-params bframes=8:qcomp=0.5:psy-rd=1.0:psy-rdoq=0.5:aq-mode=2:aq-strength=0.8:no-sao=1:threaded-me=1 -crf:v:0 32 -tag:v:0 hvc1 -c:a:0 aac -b:a:0 96k -vf "scale=960:-2:flags=lanczos,format=yuv420p10le" -movflags +faststart -progress prog_001.tmp "<分段输出>"

; —— 版本A · 带字幕烧录版（BurnSub=true 且存在同名 .ass/.srt 时）——
; ffmpeg -hide_banner -y -i "<源视频>" -ss <起始秒> -t <时长秒> -map 0:v:0? -map 0:a:0? -c:v:0 libx265 -preset:v:0 fast -x265-params bframes=8:qcomp=0.5:psy-rd=1.0:psy-rdoq=0.5:aq-mode=2:aq-strength=0.8:no-sao=1:threaded-me=1 -crf:v:0 32 -tag:v:0 hvc1 -c:a:0 aac -b:a:0 96k -vf "subtitles='<字幕路径，反斜杠改斜杠>',scale=960:-2:flags=lanczos,format=yuv420p10le" -movflags +faststart -progress prog_001.tmp "<分段输出>"

; —— 版本B · 清晰档（把上面两行的 scale=960 换成 scale=1280、crf 32 换成 crf 30 即可）——
; ffmpeg -hide_banner -y -i "<源视频>" -ss <起始秒> -t <时长秒> -map 0:v:0? -map 0:a:0? -c:v:0 libx265 -preset:v:0 fast -x265-params bframes=8:qcomp=0.5:psy-rd=1.0:psy-rdoq=0.5:aq-mode=2:aq-strength=0.8:no-sao=1:threaded-me=1 -crf:v:0 30 -tag:v:0 hvc1 -c:a:0 aac -b:a:0 96k -vf "scale=1280:-2:flags=lanczos,format=yuv420p10le" -movflags +faststart -progress prog_001.tmp "<分段输出>"

; 提示：若改用上方 FFmpegCmd（自定义命令）且非空，则本段命令里的 -x265-params / -vf scale / -movflags 全部由你的命令接管，上面的默认命令就不再生效。
